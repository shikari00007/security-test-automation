[project]
name = "security-test-automation"
version = "0.3.1.dev0"
description = "Developer Preview: Agent Skills and an offline-first static security audit runner for application development"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["security", "agent-skills", "appsec", "static-analysis", "sarif", "devsecops"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Topic :: Security", "Programming Language :: Python :: 3"]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "build>=1"]

[project.urls]
Homepage = "https://github.com/shikari00007/security-test-automation"
Issues = "https://github.com/shikari00007/security-test-automation/issues"
Source = "https://github.com/shikari00007/security-test-automation"

[project.scripts]
security-skills = "security_runner.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["security_runner*"]

[tool.setuptools.package-data]
security_runner = ["data/*.json", "data/checks/*.json", "data/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
