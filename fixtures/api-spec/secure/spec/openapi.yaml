openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
servers:
  - url: https://api.orders.test/v1
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /orders:
    get:
      summary: List orders
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: ok
    post:
      summary: Create order
      responses:
        '201':
          description: created
  /health:
    get:
      summary: Liveness
      security: []
      responses:
        '200':
          description: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
