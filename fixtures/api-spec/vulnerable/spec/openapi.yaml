openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
servers:
  - url: http://api.orders.test/v1
  - url: http://localhost:8080
paths:
  /orders:
    get:
      summary: List orders
      parameters:
        - name: api_key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
    post:
      summary: Create order
      responses:
        '201':
          description: created
  /health:
    get:
      summary: Liveness
      security: []
      responses:
        '200':
          description: ok
components:
  securitySchemes:
    queryKey:
      type: apiKey
      in: query
      name: key
