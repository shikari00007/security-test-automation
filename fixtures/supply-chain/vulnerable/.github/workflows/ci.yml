name: ci
on:
  pull_request_target:
    types: [opened]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@main
      - name: Greet
        run: echo "PR title is ${{ github.event.pull_request.title }}"
      - name: Multi
        run: |
          echo "start"
          echo "${{ github.head_ref }}"
